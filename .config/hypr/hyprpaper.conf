# hyprpaper — CURRENTLY IGNORED BY THE DAEMON.
#
# 2026-07-31: hyprpaper must be built from source alongside Hyprland, not taken
# from the distro. hyprctl and hyprpaper negotiate a `hyprpaper_core` protocol
# version; Ubuntu's hyprpaper 0.8.3 implements v1 while hyprctl 0.56 speaks v2.
# Mismatched, `hyprctl hyprpaper wallpaper` does not fail — it spins at 100% CPU
# forever waiting for an acknowledgement the daemon can't send (one such hyprctl
# ran for 1.5 days). hyprpaper is now a stage in ~/src/build-hypr.sh (currently
# 0.8.4), installed to /usr/local/bin, and hyprpaper.service is redirected there
# by ~/.config/systemd/user/hyprpaper.service.d/override.conf. Rebuild it
# whenever Hyprland is rebuilt.
#
# Re-verified on 0.8.4: this file is still ignored. A fresh daemon logs
# "Monitor DP-3 has no target: no wp will be created" and `listactive` is empty
# until something drives the IPC. `hyprctl hyprpaper preload` is still not a
# request ("invalid hyprpaper request"); `wallpaper` loads the image itself.
#
# hyprpaper 0.8.3 in Ubuntu 26.04 (`hyprpaper --version` reports an empty
# "built from commit ()") never reads this file. Verified: the daemon starts,
# binds its IPC socket, and draws no background layer, with `--verbose` showing
# no attempt to open a config at all — including when the path is forced with
# `-c`. Every documented spelling was tried (empty vs named monitor, with and
# without `preload =`, spaces and no spaces).
#
# What *does* work is the IPC, which loads the image itself:
#   hyprctl hyprpaper wallpaper ",/usr/share/hypr/wall2.png"
# `hyprctl hyprpaper preload` is gone in this version ("Unknown hyprpaper
# request"). So set-wallpaper.sh drives the daemon over IPC after it starts,
# and hyprland.conf calls that instead of relying on this file.
#
# Beware: `hyprctl hyprpaper wallpaper` exits 0 even when it does nothing.
#
# The lines below are the correct upstream syntax, kept so this starts working
# by itself if a fixed hyprpaper lands. Nothing reads them today.

wallpaper = ,/usr/share/hypr/wall2.png
splash = false
ipc = on
