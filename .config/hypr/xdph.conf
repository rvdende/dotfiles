
# Force screen-capture frames over SHM (CPU memory) instead of DMA-BUF.
# Works around NVIDIA 610 EGL/GBM segfault importing block-linear modifier
# buffers during WebRTC screen share. Only affects the capture path, NOT
# scanout (unlike AQ_NO_MODIFIERS, which breaks display output on this GPU).
screencopy {
    force_shm = 1
}
