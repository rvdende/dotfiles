# Hyprland — personal config.
#
# Layered on top of the packaged defaults so that distro updates to
# /usr/share/hypr/hyprland.conf (new binds, changed syntax) still reach us.
# Anything set *after* the source line wins.
source = /usr/share/hypr/hyprland.conf

# --- session plumbing -------------------------------------------------------
# The packaged config autostarts nothing. Without these, xdg-desktop-portal
# (screen share, file pickers, GTK settings) and any app asking for privileges
# come up broken, because the user-level systemd/D-Bus environment never learns
# that a Wayland session exists.
exec-once = systemctl --user import-environment WAYLAND_DISPLAY XDG_CURRENT_DESKTOP HYPRLAND_INSTANCE_SIGNATURE
exec-once = dbus-update-activation-environment --systemd WAYLAND_DISPLAY XDG_CURRENT_DESKTOP HYPRLAND_INSTANCE_SIGNATURE
# Activate graphical-session.target (Hyprland does not do this on its own).
# Pulls in graphical-session.target via hyprland-session.target so user units
# ordered After/PartOf=graphical-session.target start correctly. Must run after
# the two lines above so the session env is already imported.
exec-once = systemctl --user start hyprland-session.target

# Graphical polkit prompts (e.g. mounting a disk, GParted). Ships a user unit.
exec-once = systemctl --user start hyprpolkitagent

# --- desktop components -----------------------------------------------------
# waybar is started by waybar.service (pulled in by hyprland-session.target
# above) — do NOT also launch it here or you get two stacked bars.
# exec-once = waybar
exec-once = swaync

# hyprpaper ignores its config file on this build — the wrapper sets the
# wallpaper over IPC once the daemon is listening. See hyprpaper.conf.
#
# The daemon itself is started by hyprpaper.service (enabled in global scope by
# the distro package, so it starts whether we like it or not) — do NOT also
# launch it here or two daemons fight over .hyprpaper.sock. The unit's
# ExecStart is redirected to the /usr/local build by
# ~/.config/systemd/user/hyprpaper.service.d/override.conf; Ubuntu's 0.8.3
# hangs hyprctl forever. See hyprpaper.conf.
# exec-once = hyprpaper
exec-once = ~/.config/hypr/set-wallpaper.sh

# --- Qt / QML appearance ----------------------------------------------------
# hyprland-dialog (from hyprland-qtutils, what Hyprland shells out to for
# app-not-responding prompts) is a Qt Quick Controls app. With no style set, Qt
# picks `Basic` — an unthemed flat light look, glaringly wrong on a dark desktop.
#
# These are exported to every child of Hyprland, so they restyle all Qt Quick
# apps, not just the dialog. Widget-based Qt apps are unaffected: they follow
# QT_QPA_PLATFORMTHEME (qt6-gtk-platformtheme is installed) instead.
env = QT_QPA_PLATFORM,wayland;xcb
env = QT_QUICK_CONTROLS_STYLE,Material
env = QT_QUICK_CONTROLS_MATERIAL_THEME,Dark
env = QT_QUICK_CONTROLS_MATERIAL_ACCENT,#7aa2f7

# --- NVIDIA screen-share fix -----------------------------------------------
# NOTE: `env = AQ_NO_MODIFIERS,1` was tried here to fix screen-share crashes
# but it BREAKS display scanout on this RTX 4090 (Hyprland runs, but the
# monitor gets no signal — linear buffers can't be scanned out). Do not
# re-enable it. See ~/work/hyprsettings/TROUBLESHOOTING.md for the status.

# --- defaults that point at software we don't have --------------------------
# Packaged config sets $menu=hyprlauncher and $fileManager=dolphin; neither is
# installed, so SUPER+R / SUPER+E would do nothing at all.
#
# Hyprland expands variables at parse time, so redefining these AFTER the
# sourced config does not retarget the binds it already parsed — the old value
# is baked in. Both the variable and the bind have to be restated.
$fileManager = nautilus
$menu = rofi -show drun

# `bind` on an already-bound key appends rather than replaces, leaving two
# entries for the same combo — drop the sourced ones first.
unbind = $mainMod, R
unbind = $mainMod, E
bind = $mainMod, R, exec, $menu
bind = $mainMod, E, exec, $fileManager

# --- swap Q and C -----------------------------------------------------------
# Packaged config has Q=terminal, C=close. Swapped so Q closes ("quit") and C
# opens a terminal, which is the way round muscle memory expects.
# Same append-not-replace caveat as above: unbind both before rebinding, or each
# combo ends up firing the old dispatcher as well as the new one.
unbind = $mainMod, Q
unbind = $mainMod, C
bind = $mainMod, Q, killactive
bind = $mainMod, C, exec, $terminal

# --- logout -----------------------------------------------------------------
# SUPER+L cleanly exits Hyprland, dropping back to the display manager / TTY.
# (Note: L is the lock-screen combo on many setups — this is logout, not lock.)
bindd = $mainMod, L, Exit Hyprland (logout), exit

# --- dev loop ---------------------------------------------------------------
# `cargo watch -x run` kills and respawns the app on every save. While the app
# window is tiled, each respawn pulls it out of the dwindle tree and re-inserts
# it, which reshuffles every other window on the workspace. Floating it takes it
# out of tiling entirely, so nothing else reflows.
#
# No move/size here on purpose: those would pin the window to fixed coordinates
# and discard any repositioning done by hand. The daemon below remembers where
# the window actually was and reapplies that instead — a rule here would just
# fight it.
#
# Requires robot2gui to set its Wayland app_id (Bevy `Window::name`) — with the
# default `None` the compositor sees an empty class and this rule cannot match.
windowrule {
    name = robot2gui-dev

    match:class = ^(robot2gui)$

    float = yes

    # Each respawn is a brand-new window, and a new window normally takes focus —
    # which yanks the keyboard out of the editor mid-edit on every save. Suppress
    # focus *on open* only; clicking the window still focuses it as usual.
    # (`no_focus` would be wrong here: that makes the window unfocusable for good.)
    no_initial_focus = true
}

# --- window switcher --------------------------------------------------------
# Hyprland ships no Alt+Tab bind and no switcher of its own, so the key does
# nothing out of the box. snappy-switcher (built from source in ~/.local/src) is
# a layer-shell switcher: it enumerates windows over the compositor's own
# protocol, so it sees native Wayland toplevels — an X11 switcher such as
# `rofi -show window` only sees XWayland clients and would miss most of them.
#
# `--mod alt` is what makes it behave like a real Alt+Tab: the daemon watches the
# XKB modifier mask and commits the selection when Alt is *released*, so holding
# Alt and tapping Tab walks the list. It must match the modifier in the bind.
exec-once = ~/.local/bin/snappy-switcher --daemon

bindd = ALT, Tab, Switch window, exec, ~/.local/bin/snappy-switcher next --mod alt
bindd = ALT SHIFT, Tab, Switch window (reverse), exec, ~/.local/bin/snappy-switcher prev --mod alt

# --- screenshots & recording -------------------------------------------------
# PrintScreen opens a rofi mode menu (region / window / fullscreen / record).
# While a recording is running PrintScreen instead *stops* it, so the one key
# both starts and ends a capture and there is nothing extra to remember.
#
# hypr-capture drives grim + slurp + wf-recorder and hands stills to swappy for
# annotation (it prefers satty if that is ever installed). This is deliberately
# a script over ordinary tools rather than a compositor plugin like HyprCapture:
# plugins are ABI-locked to one Hyprland commit, exactly as noted for hyprbars
# below, and HyprCapture ships nothing built for 0.53.x.
bindd = , Print, Capture menu, exec, ~/.local/bin/hypr-capture
bindd = SHIFT, Print, Screenshot region, exec, ~/.local/bin/hypr-capture region
bindd = $mainMod, Print, Screenshot window, exec, ~/.local/bin/hypr-capture window
bindd = CTRL, Print, Screenshot fullscreen, exec, ~/.local/bin/hypr-capture screen
bindd = $mainMod SHIFT, Print, Record region, exec, ~/.local/bin/hypr-capture record-region

# --- hyprbars ---------------------------------------------------------------
# Title bars, from Ubuntu's hyprland-plugin-hyprbars. Deliberately the packaged
# plugin rather than a hyprpm build: Hyprland validates plugin ABI at load and
# refuses anything built against a different compiler/commit. The package pins
# this via the virtual `hyprland-abi-6d24081` that our hyprland provides, so apt
# itself guarantees the match and a Hyprland upgrade cannot silently break it.
#
# Note there is NO `plugin = <path>` directive for loading — `plugin` is only the
# name of the config *category* below. Writing `plugin = /path/to.so` is accepted
# by the parser and then silently does nothing, so loading has to go through
# hyprctl. (hyprpm is the other way, but it wants to build the plugin itself
# against Hyprland's source, which is pointless when the distro ships a
# guaranteed-matching binary.)
#
# Loads without a prompt because ecosystem:enforce_permissions is 0. If that is
# ever turned on, this needs an accompanying:
#   permission = /usr/(bin|local/bin)/hyprctl, plugin, allow
exec-once = hyprctl plugin load /usr/lib/x86_64-linux-gnu/hyprland/plugins/libhyprbars.so

plugin {
    hyprbars {
        bar_height = 28
        bar_color = rgb(1a1b26)
        col.text = rgb(c0caf5)
        bar_text_size = 11
        # Nerd Font (installed to ~/.local/share/fonts — not in the Ubuntu repos)
        # so the button glyphs below resolve. Propo is the proportional cut, which
        # reads better for titles than the monospaced one.
        bar_text_font = JetBrainsMono Nerd Font Propo
        bar_text_align = left
        bar_padding = 10
        bar_button_padding = 8

        # Leave at the upstream default of false. Setting it true makes the bar and
        # the border contend for the same pixels, and on hover they retrigger each
        # other's redraw every frame — the border visibly strobes and the cursor
        # buffer gets re-imported into KMS on each frame with it.
        bar_precedence_over_border = false

        on_double_click = hyprctl dispatch fullscreen 1

        # hyprbars-button = bgcolor, size, icon, action, fgcolor — laid out right to
        # left. The accent lives on the glyph (5th field); the dot behind it is only
        # a faint lift off the bar colour. Note fgcolor defaults to WHITE if omitted.
        #
        # `size` is the dot; the glyph is hardcoded upstream to 0.62 * size and is
        # not separately configurable, so the gap around the icon is always ~19% of
        # size per side. Growing the dot is therefore the only way to buy more
        # padding in absolute pixels — hence 18 rather than 13.
        #
        # The icon font is also hardcoded upstream to "sans", so bar_text_font does
        # NOT apply here; these glyphs resolve purely by fontconfig falling back to
        # the Nerd Font in ~/.local/share/fonts. Remove that font and they turn to
        # tofu, whatever bar_text_font says.
        #
        # Icons are U+F00D / U+F2D0 / U+F2D2. Beware: editors and tooling sometimes
        # eat these PUA codepoints on save, leaving an empty icon field and buttons
        # that silently render as blank dots. If that happens, rewrite them by
        # ordinal rather than pasting the literal character.
        hyprbars-button = rgb(242736), 18, , hyprctl dispatch killactive, rgb(f7768e)
        hyprbars-button = rgb(242736), 18, , hyprctl dispatch fullscreen 1, rgb(e0af68)
        hyprbars-button = rgb(242736), 18, , hyprctl dispatch togglefloating, rgb(9ece6a)
    }
}

# --- escape hatches ---------------------------------------------------------
# SUPER+Q      close window      (swapped with C above)
# SUPER+C      terminal          (kitty)
# SUPER+M      exit Hyprland  -> back to GDM
# Ctrl+Alt+F3  text TTY, always, even if the compositor is wedged.

# --- input ------------------------------------------------------------------
# Turn Num Lock on at session start. This block merges into the input{} in the
# sourced /usr/share/hypr/hyprland.conf (which sets kb_layout etc. and has no
# numlock setting), so only this one key is overridden.
#
# The Q6 HE firmware paints the numpad red whenever the host reports Num Lock
# off (arrow mode) and white when it is on. Host state resets on replug, so
# without this the numpad comes back red after every reconnect.
input {
    numlock_by_default = true
}

# --- extra F-row workspace keys ---------------------------------------------
# The keyboard's F13-F16 (the extra keys past F12) jump straight to workspaces
# 1-4, so the common switches need no modifier at all — SUPER+1..4 from the
# sourced config still work and are untouched.
#
# No `unbind` needed here, unlike SUPER+R/E/Q/C above: nothing in the packaged
# config binds F13-F16, so there is no existing bind for these to append to.
#
# Bare keys (empty modmask before the comma) are only safe because F13-F16 are
# unreachable on a normal keyboard — no application can claim them, and they
# cannot be typed by accident.
#
# Bound by KEYCODE, not by name: writing `F13` here does NOT work. The keys do
# emit KEY_F13..KEY_F16 (evdev 183-186, confirmed with evtest), and
# xkb's keycodes/evdev maps those to <FK13>..<FK16> — but symbols/pc assigns
# them no keysym (the F13-F16 keysyms live in symbols/fkeys, which the default
# pc+us layout never includes). Hyprland therefore sees NoSymbol and a `F13`
# bind matches nothing. `code:` skips keysym lookup entirely.
#
# The numbers are X keycodes = evdev code + 8, so 183+8 = 191.
bindd = , code:191, Workspace 1, workspace, 1   # F13
bindd = , code:192, Workspace 2, workspace, 2   # F14
bindd = , code:193, Workspace 3, workspace, 3   # F15
bindd = , code:194, Workspace 4, workspace, 4   # F16

# Same keys with a modifier move the focused window instead of just switching:
#   SHIFT — send it away, stay put (silent = focus does not follow)
#   CTRL  — send it and go with it, matching SUPER+SHIFT+1..0 from the sourced
#           config, which uses plain `movetoworkspace`.
# SUPER is deliberately not used here: SUPER+F13 would collide with nothing, but
# the bare keys are already the "no modifier needed" ergonomics of this block.
bindd = SHIFT, code:191, Move window to workspace 1 (silent), movetoworkspacesilent, 1   # F13
bindd = SHIFT, code:192, Move window to workspace 2 (silent), movetoworkspacesilent, 2   # F14
bindd = SHIFT, code:193, Move window to workspace 3 (silent), movetoworkspacesilent, 3   # F15
bindd = SHIFT, code:194, Move window to workspace 4 (silent), movetoworkspacesilent, 4   # F16

bindd = CTRL, code:191, Move window to workspace 1, movetoworkspace, 1   # F13
bindd = CTRL, code:192, Move window to workspace 2, movetoworkspace, 2   # F14
bindd = CTRL, code:193, Move window to workspace 3, movetoworkspace, 3   # F15
bindd = CTRL, code:194, Move window to workspace 4, movetoworkspace, 4   # F16
