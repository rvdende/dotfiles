# hyprlock — screen locker.
#
# hyprlock 0.9.2 refuses to start at all without this file:
#   [CRITICAL] ConfigManager threw: Could not find config in HOME, ...
# It fails closed (never locks) rather than locking with no way in, so a missing
# config is safe — just useless.

general {
    hide_cursor = true
    ignore_empty_input = true    # Enter on an empty field does nothing
}

background {
    monitor =
    path = /usr/share/hypr/wall2.png
    blur_passes = 2
    blur_size = 6
}

input-field {
    monitor =
    size = 320, 50
    position = 0, -40
    halign = center
    valign = center

    outline_thickness = 2
    dots_center = true
    rounding = 8

    outer_color = rgba(122, 162, 247, 0.9)
    inner_color = rgba(20, 20, 24, 0.85)
    font_color  = rgb(216, 216, 224)

    fade_on_empty = false
    placeholder_text = <i>Password…</i>
    fail_text = <i>Wrong — attempt $ATTEMPTS</i>
}

# Clock, above the input field.
label {
    monitor =
    text = cmd[update:1000] date +"%H:%M"
    font_size = 88
    color = rgba(255, 255, 255, 0.95)
    position = 0, 120
    halign = center
    valign = center
}

label {
    monitor =
    text = $USER
    font_size = 15
    color = rgba(200, 200, 210, 0.8)
    position = 0, 20
    halign = center
    valign = center
}
